[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noisebot-server"
version = "0.1.0"
description = "NoiseBot local companion server"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "av>=14.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
llm = ["openai>=1.30"]
uart = ["pyserial-asyncio>=0.6"]
vision = ["opencv-python-headless>=4.8", "numpy>=1.24"]
codec = ["numpy>=1.24"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio==0.23.8",
]

[project.scripts]
noisebot-server = "noisebot_server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["noisebot_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning:pytest_asyncio\\.plugin",
    "ignore:'asyncio\\.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio\\.plugin",
    "ignore:'asyncio\\.set_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio\\.plugin",
]
